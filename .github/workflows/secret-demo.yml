name: Secret Demo
on:
    workflow_dispatch:
jobs:
    secret-demo:
        runs-on: ubuntu-latest
        env:
            DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        steps:
            - run: |
                  if [ -z "$DEMO_TOKEN" ]; then
                      echo "secret absent"; exit 1
                  fi
                    echo "longueur : ${#DEMO_TOKEN}"
                    echo "valeur : ${{ vars.APP_ENV }}"
